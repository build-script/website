# The site on GitHub Pages after every push to main, built with the address of the Pages settings and with the docs,
# the version and the commit of main of build-script and its plugins. Those change without a push here, so both send
# a repository_dispatch: build-script of the type build-script once its main is green, the plugins of the type plugins
# after every push to main. A daily build catches up when a dispatch got lost.
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  repository_dispatch:
    types: [build-script, plugins]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, a newer push waits instead of cancelling a deploy halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Docs
        run: npm run docs

      - name: Check and build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
