# The type check and the build of the site on every push and pull request
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Docs
        run: npm run docs

      - name: Check and build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Size of the pages
        run: |
          for page in $(cd dist && find . -name index.html | sort); do
            echo "$page: $(wc -c < "dist/$page") bytes, $(gzip -9 -c "dist/$page" | wc -c) gzipped"
          done
          ls -l dist/_astro dist/_astro/fonts
